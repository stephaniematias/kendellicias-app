name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
      - name: Add Android platform & sync
        run: |
          npx cap add android
          npx cap sync android
      - name: Replace app icon with Kendellícia's logo
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -f icons/mipmap-mdpi/ic_launcher.png icons/mipmap-mdpi/ic_launcher_round.png android/app/src/main/res/mipmap-mdpi/
          cp -f icons/mipmap-hdpi/ic_launcher.png icons/mipmap-hdpi/ic_launcher_round.png android/app/src/main/res/mipmap-hdpi/
          cp -f icons/mipmap-xhdpi/ic_launcher.png icons/mipmap-xhdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xhdpi/
          cp -f icons/mipmap-xxhdpi/ic_launcher.png icons/mipmap-xxhdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xxhdpi/
          cp -f icons/mipmap-xxxhdpi/ic_launcher.png icons/mipmap-xxxhdpi/ic_launcher_round.png android/app/src/main/res/mipmap-xxxhdpi/
      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
